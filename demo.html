<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online Course Login</title>
    <link rel="stylesheet" href="styles.css" />
    <style>

        
  /* Basic Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* Animated Gradient Background with 4 colors */
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #667eea);
    background-size: 400% 400%;
    animation: gradientAnimation 15s ease infinite;
}

@keyframes gradientAnimation {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}

/* Floating animation for the container */
@keyframes float {
    0%, 100% {
        transform: translateY(0);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    50% {
        transform: translateY(-10px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }
}

/* Fade & slide in form */
@keyframes fadeSlideIn {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Pulse animation for heading */
@keyframes pulseGlow {
    0%, 100% {
        text-shadow: 0 0 6px #ff6f91;
        color: #ff4a75;
    }
    50% {
        text-shadow: 0 0 20px #ff9aa2;
        color: #ff6f91;
    }
}

.login-container {
    background-color: rgba(255, 255, 255, 0.95);
    padding: 2.5rem 3rem;
    border-radius: 12px;
    width: 370px;
    text-align: center;
    backdrop-filter: blur(10px);
    animation: float 6s ease-in-out infinite, fadeSlideIn 1s ease forwards;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
}

.login-heading {
    margin-bottom: 1.5rem;
    font-weight: 700;
    font-size: 1.8rem;
    animation: pulseGlow 3s ease-in-out infinite;
}

.login-form {
    display: flex;
    flex-direction: column;
}

.login-form label {
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: #555;
    text-align: left;
}

/* Inputs with multi-color linear gradient borders on hover/focus */
.login-form input[type="email"],
.login-form input[type="password"] {
    padding: 0.75rem;
    margin-bottom: 1.25rem;
    border: 2px solid transparent;
    border-radius: 5px;
    font-size: 1rem;
    background-color: white;
    transition: border 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
}

/* Gradient border on hover and focus */
.login-form input[type="email"]:hover,
.login-form input[type="password"]:hover,
.login-form input[type="email"]:focus,
.login-form input[type="password"]:focus {
    border-image-slice: 1;
    border-width: 2px;
    border-style: solid;
    border-image-source: linear-gradient(45deg, #ff6f91, #ff9472, #ffcc70, #a1c4fd);
    box-shadow: 0 0 12px rgba(255, 111, 145, 0.7);
    transform: scale(1.05);
    outline: none;
}

/* Form options container */
.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
}

.checkbox-container {
    display: flex;
    align-items: center;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    user-select: none;
    font-size: 0.9rem;
}

.checkbox-container input[type="checkbox"] {
    margin-right: 0.5rem;
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: #ff6f91; /* modern browsers */
}

.forgot-password {
    font-size: 0.9rem;
    color: #ff6f91;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.forgot-password:hover {
    color: #ff4a75;
    text-decoration: underline;
}

/* Login button with multi-color linear gradient background */
.btn-login {
    padding: 0.75rem;
    background: linear-gradient(90deg, #ff6f91, #ff9472, #ffcc70, #a1c4fd);
    border: none;
    border-radius: 5px;
    color: white;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background-position 0.5s ease, transform 0.3s ease, box-shadow 0.3s ease;
    background-size: 300% 300%;
    background-position: 0% 50%;
}

/* Animate background gradient on hover */
.btn-login:hover {
    background-position: 100% 50%;
    transform: scale(1.05);
    box-shadow: 0 6px 15px rgba(255, 74, 117, 0.7);
}

/* Signup text and link */
.signup-text {
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: #555;
}

.signup-text a {
    color: #ff6f91;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.signup-text a:hover {
    text-decoration: underline;
    color: #ff4a75;
}

    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-heading">Login to Your Course</h2>
        <form action="#" method="post" class="login-form" autocomplete="off">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember" />
                    Remember Me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">Login</button>

            <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
        </form>
    </div>
</body>
</html>
